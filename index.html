<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מריו 2D - עולם מורחב וגרביטציה נמוכה</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5c94fc;
            font-family: Arial, sans-serif;
        }

        #gameCanvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            z-index: 10;
        }

        #gameOverScreen h1 { font-size: 60px; margin-bottom: 10px; }
        #gameOverScreen p { font-size: 24px; margin-bottom: 20px; }
        #restartBtn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="ui">
        ניקוד: <span id="score">0</span>
    </div>

    <div id="gameOverScreen">
        <h1>המשחק נגמר!</h1>
        <p>הניקוד הסופי שלך: <span id="finalScore">0</span></p>
        <button id="restartBtn">שחק שוב</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiScore = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- הגדרות משחק (עודכנו לגרביטציה נמוכה ועולם ענק) ---
        const GRAVITY = 0.3; // גרביטציה נמוכה במיוד
        const MARIO_SPEED = 6;
        const JUMP_FORCE = -12;
        const TILE_SIZE = 40;
        const WORLD_WIDTH = 4000; // הגדלת רוחב העולם

        let keys = {};
        let score = 0;
        let isGameOver = false;
        let platforms = [];
        let coins = [];
        let enemies = [];
        let mario;
        let cameraX = 0;

        class Player {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.velX = 0;
                this.velY = 0;
                this.onGround = false;
                this.color = '#e74c3c';
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - cameraX, this.y, this.width, this.height);
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(this.x - cameraX, this.y, this.width, this.height * 0.3);
            }

            update() {
                if (keys['ArrowRight'] || keys['d']) this.velX = MARIO_SPEED;
                else if (keys['ArrowLeft'] || keys['a']) this.velX = -MARIO_SPEED;
                else this.velX = 0;

                if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && this.onGround) {
                    this.velY = JUMP_FORCE;
                    this.onGround = false;
                }

                this.velY += GRAVITY;

                this.x += this.velX;
                this.y += this.velY;

                if (this.y + this.height > canvas.height) {
                    this.y = canvas.height - this.height;
                    this.velY = 0;
                    this.onGround = true;
                }

                if (this.x < 0) this.x = 0;
                if (this.x + this.width > WORLD_WIDTH) this.x = WORLD_WIDTH - this.width;

                this.onGround = false;
            }
        }

        class Platform {
            constructor(x, y, width, height, color = '#8e44ad') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - cameraX, this.y, this.width, this.height);
                ctx.strokeStyle = '#2c3e50';
                ctx.strokeRect(this.x - cameraX, this.y, this.width, this.height);
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = TILE_SIZE * 0.6;
                this.height = TILE_SIZE * 0.8;
                this.collected = false;
                this.color = '#f1c40f';
            }

            draw() {
                if (this.collected) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - cameraX, this.y, this.width, this.height);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(this.x - cameraX + this.width * 0.2, this.y + this.height * 0.2, this.width * 0.2, this.height * 0.2);
            }
        }

        class Enemy {
            constructor(x, y, width, height, minX, maxX) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.velX = 2;
                this.color = '#c0392b';
                this.minX = minX;
                this.maxX = maxX;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - cameraX, this.y, this.width, this.height);
            }

            update() {
                this.x += this.velX;
                if (this.x < this.minX || this.x + this.width > this.maxX) {
                    this.velX = -this.velX;
                }
            }
        }

        function checkCollision(obj1, obj2) {
            return (
                obj1.x < obj2.x + obj2.width &&
                obj1.x + obj1.width > obj2.x &&
                obj1.y < obj2.y + obj2.height &&
                obj1.y + obj1.height > obj2.y
            );
        }

        function resolvePlatformCollisions(player, platform) {
            if (player.velY > 0 &&
                player.y + player.height > platform.y &&
                player.y + player.height - player.velY <= platform.y) {
                player.y = platform.y - player.height;
                player.velY = 0;
                player.onGround = true;
            }
            else if (player.velY < 0 &&
                     player.y < platform.y + platform.height &&
                     player.y - player.velY >= platform.y + platform.height) {
                player.y = platform.y + platform.height;
                player.velY = 0;
            }
            else if (player.x < platform.x + platform.width &&
                     player.x + player.width > platform.x) {
                if (player.velX > 0) player.x = platform.x - player.width;
                else if (player.velX < 0) player.x = platform.x + platform.width;
                player.velX = 0;
            }
        }

        function initGame() {
            score = 0;
            cameraX = 0;
            isGameOver = false;
            uiScore.textContent = score;
            gameOverScreen.style.visibility = 'hidden';

            mario = new Player(TILE_SIZE * 2, canvas.height - TILE_SIZE * 3, TILE_SIZE, TILE_SIZE * 1.5);

            // בניית עולם מורחב עם פלטפורמות, מטבעות ואויבים לאורך 4000 פיקסלים
            platforms = [
                new Platform(0, canvas.height - TILE_SIZE, WORLD_WIDTH, TILE_SIZE, '#27ae60'),
                new Platform(300, canvas.height - TILE_SIZE * 4, 200, TILE_SIZE),
                new Platform(600, canvas.height - TILE_SIZE * 7, 250, TILE_SIZE),
                new Platform(950, canvas.height - TILE_SIZE * 5, 180, TILE_SIZE),
                new Platform(1300, canvas.height - TILE_SIZE * 8, 300, TILE_SIZE),
                new Platform(1700, canvas.height - TILE_SIZE * 4, 200, TILE_SIZE),
                new Platform(2000, canvas.height - TILE_SIZE * 6, 250, TILE_SIZE),
                new Platform(2400, canvas.height - TILE_SIZE * 9, 300, TILE_SIZE),
                new Platform(2850, canvas.height - TILE_SIZE * 5, 200, TILE_SIZE),
                new Platform(3200, canvas.height - TILE_SIZE * 7, 400, TILE_SIZE),
            ];

            coins = [
                new Coin(350, canvas.height - TILE_SIZE * 5.5),
                new Coin(650, canvas.height - TILE_SIZE * 8.5),
                new Coin(700, canvas.height - TILE_SIZE * 8.5),
                new Coin(1350, canvas.height - TILE_SIZE * 9.5),
                new Coin(1400, canvas.height - TILE_SIZE * 9.5),
                new Coin(2050, canvas.height - TILE_SIZE * 7.5),
                new Coin(2500, canvas.height - TILE_SIZE * 10.5),
                new Coin(3300, canvas.height - TILE_SIZE * 8.5),
            ];

            enemies = [
                new Enemy(500, canvas.height - TILE_SIZE * 2, TILE_SIZE, TILE_SIZE, 400, 800),
                new Enemy(1350, canvas.height - TILE_SIZE * 9, TILE_SIZE, TILE_SIZE, 1300, 1550),
                new Enemy(2100, canvas.height - TILE_SIZE * 2, TILE_SIZE, TILE_SIZE, 1900, 2300),
                new Enemy(3250, canvas.height - TILE_SIZE * 8, TILE_SIZE, TILE_SIZE, 3200, 3550),
            ];
        }

        function updateCamera() {
            // המצלמה ממקמת את מאריו במרכז המסך
            cameraX = mario.x - canvas.width / 2 + mario.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;
        }

        function gameLoop() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            mario.update();
            enemies.forEach(enemy => enemy.update());
            updateCamera();

            platforms.forEach(platform => {
                if (checkCollision(mario, platform)) {
                    resolvePlatformCollisions(mario, platform);
                }
            });

            coins.forEach(coin => {
                if (!coin.collected && checkCollision(mario, coin)) {
                    coin.collected = true;
                    score += 100;
                    uiScore.textContent = score;
                }
            });

            enemies.forEach(enemy => {
                if (checkCollision(mario, enemy)) {
                    if (mario.velY > 0 && mario.y + mario.height - mario.velY <= enemy.y) {
                        enemies = enemies.filter(e => e !== enemy);
                        mario.velY = JUMP_FORCE * 0.6;
                        score += 200;
                        uiScore.textContent = score;
                    } else {
                        endGame();
                    }
                }
            });

            platforms.forEach(platform => platform.draw());
            coins.forEach(coin => coin.draw());
            enemies.forEach(enemy => enemy.draw());
            mario.draw();

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            finalScore.textContent = score;
            gameOverScreen.style.visibility = 'visible';
        }

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            initGame();
            gameLoop();
        });

        initGame();
        gameLoop();
    </script>
</body>
</html>
