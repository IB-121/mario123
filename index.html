<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מריו 2D פשוט ב-Canvas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #5c94fc; /* צבע שמיים מריו */
            font-family: Arial, sans-serif;
        }

        #gameCanvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 2px black;
            pointer-events: none;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            z-index: 10;
        }

        #gameOverScreen h1 { font-size: 60px; margin-bottom: 10px; }
        #gameOverScreen p { font-size: 24px; margin-bottom: 20px; }
        #restartBtn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="ui">
        ניקוד: <span id="score">0</span>
    </div>

    <div id="gameOverScreen">
        <h1>המשחק נגמר!</h1>
        <p>הניקוד הסופי שלך: <span id="finalScore">0</span></p>
        <button id="restartBtn">שחק שוב</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiScore = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // הגדרת גודל הקנבס למסך מלא
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- הגדרות משחק ---
        const GRAVITY = 0.8;
        const MARIO_SPEED = 5;
        const JUMP_FORCE = -15;
        const TILE_SIZE = 40; // גודל קוביה בסיסי

        // --- משתני מדינה (State) ---
        let keys = {};
        let score = 0;
        let isGameOver = false;
        let platforms = [];
        let coins = [];
        let enemies = [];
        let mario;

        // --- מחלקות (Classes) ---

        class Player {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.velX = 0;
                this.velY = 0;
                this.onGround = false;
                this.color = '#e74c3c'; // אדום מריו
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // כובע פשוט
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(this.x, this.y, this.width, this.height * 0.3);
            }

            update() {
                // תנועה אופקית
                if (keys['ArrowRight'] || keys['d']) this.velX = MARIO_SPEED;
                else if (keys['ArrowLeft'] || keys['a']) this.velX = -MARIO_SPEED;
                else this.velX = 0;

                // קפיצה
                if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && this.onGround) {
                    this.velY = JUMP_FORCE;
                    this.onGround = false;
                }

                // החלת כוח כבידה
                this.velY += GRAVITY;

                // עדכון מיקום
                this.x += this.velX;
                this.y += this.velY;

                // התנגשות עם גבולות המסך (רצפה)
                if (this.y + this.height > canvas.height) {
                    this.y = canvas.height - this.height;
                    this.velY = 0;
                    this.onGround = true;
                }

                // מניעת יציאה מהצדדים
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

                this.onGround = false; // איפוס, יתעדכן בהתנגשות עם פלטפורמה
            }
        }

        class Platform {
            constructor(x, y, width, height, color = '#8e44ad') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // קו מתאר
                ctx.strokeStyle = '#2c3e50';
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = TILE_SIZE * 0.6;
                this.height = TILE_SIZE * 0.8;
                this.collected = false;
                this.color = '#f1c40f'; // זהב
            }

            draw() {
                if (this.collected) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // אפקט ברק פשוט
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(this.x + this.width * 0.2, this.y + this.height * 0.2, this.width * 0.2, this.height * 0.2);
            }
        }

        class Enemy {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.velX = 2; // מהירות אויב
                this.color = '#c0392b'; // אדום כהה
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                this.x += this.velX;

                // התנגשות עם גבולות המסך (צדדים) - פטרול
                if (this.x < 0 || this.x + this.width > canvas.width) {
                    this.velX = -this.velX;
                }
            }
        }

        // --- פונקציות עזר (Helper Functions) ---

        function checkCollision(obj1, obj2) {
            return (
                obj1.x < obj2.x + obj2.width &&
                obj1.x + obj1.width > obj2.x &&
                obj1.y < obj2.y + obj2.height &&
                obj1.y + obj1.height > obj2.y
            );
        }

        function resolvePlatformCollisions(player, platform) {
            // התנגשות מלמעלה (נחיתה)
            if (player.velY > 0 &&
                player.y + player.height > platform.y &&
                player.y + player.height - player.velY <= platform.y) {
                player.y = platform.y - player.height;
                player.velY = 0;
                player.onGround = true;
            }
            // התנגשות מלמטה (ראש בבלוק)
            else if (player.velY < 0 &&
                     player.y < platform.y + platform.height &&
                     player.y - player.velY >= platform.y + platform.height) {
                player.y = platform.y + platform.height;
                player.velY = 0;
            }
            // התנגשות מהצדדים
            else if (player.x < platform.x + platform.width &&
                     player.x + player.width > platform.x) {
                // התנגשות מימין
                if (player.velX > 0) {
                    player.x = platform.x - player.width;
                }
                // התנגשות משמאל
                else if (player.velX < 0) {
                    player.x = platform.x + platform.width;
                }
                player.velX = 0;
            }
        }

        // --- פונקציות ליבה של המשחק ---

        function initGame() {
            score = 0;
            isGameOver = false;
            uiScore.textContent = score;
            gameOverScreen.style.visibility = 'hidden';

            // יצירת השחקן
            mario = new Player(TILE_SIZE * 2, canvas.height - TILE_SIZE * 3, TILE_SIZE, TILE_SIZE * 1.5);

            // יצירת פלטפורמות (מפות בסיסית)
            platforms = [
                // רצפה ראשית
                new Platform(0, canvas.height - TILE_SIZE, canvas.width, TILE_SIZE, '#27ae60'),
                // פלטפורמות באוויר
                new Platform(TILE_SIZE * 5, canvas.height - TILE_SIZE * 4, TILE_SIZE * 3, TILE_SIZE),
                new Platform(TILE_SIZE * 10, canvas.height - TILE_SIZE * 6, TILE_SIZE * 4, TILE_SIZE),
                new Platform(TILE_SIZE * 16, canvas.height - TILE_SIZE * 4, TILE_SIZE * 2, TILE_SIZE),
                new Platform(TILE_SIZE * 21, canvas.height - TILE_SIZE * 7, TILE_SIZE * 5, TILE_SIZE),
            ];

            // יצירת מטבעות
            coins = [
                new Coin(TILE_SIZE * 6, canvas.height - TILE_SIZE * 5.5),
                new Coin(TILE_SIZE * 11, canvas.height - TILE_SIZE * 7.5),
                new Coin(TILE_SIZE * 12, canvas.height - TILE_SIZE * 7.5),
                new Coin(TILE_SIZE * 17, canvas.height - TILE_SIZE * 5.5),
                new Coin(TILE_SIZE * 23, canvas.height - TILE_SIZE * 8.5),
            ];

            // יצירת אויבים
            enemies = [
                new Enemy(TILE_SIZE * 12, canvas.height - TILE_SIZE * 2, TILE_SIZE, TILE_SIZE),
                new Enemy(TILE_SIZE * 22, canvas.height - TILE_SIZE * 8, TILE_SIZE, TILE_SIZE),
            ];
        }

        function gameLoop() {
            if (isGameOver) return;

            // 1. ניקוי המסך
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. עדכון אובייקטים
            mario.update();
            enemies.forEach(enemy => enemy.update());

            // 3. טיפול בהתנגשויות

            // מריו עם פלטפורמות
            platforms.forEach(platform => {
                if (checkCollision(mario, platform)) {
                    resolvePlatformCollisions(mario, platform);
                }
            });

            // מריו עם מטבעות
            coins.forEach(coin => {
                if (!coin.collected && checkCollision(mario, coin)) {
                    coin.collected = true;
                    score += 100;
                    uiScore.textContent = score;
                }
            });

            // מריו עם אויבים (פגיעה = משחק נגמר)
            enemies.forEach(enemy => {
                if (checkCollision(mario, enemy)) {
                    // בדיקה אם מאריו נוחת על האויב מלמעלה
                    if (mario.velY > 0 && mario.y + mario.height - mario.velY <= enemy.y) {
                        // האויב מובס (מוסר מהמערך)
                        enemies = enemies.filter(e => e !== enemy);
                        mario.velY = JUMP_FORCE * 0.6; // קפיצה קטנה לאחר הבסה
                        score += 200;
                        uiScore.textContent = score;
                    } else {
                        // פגיעה רגילה = משחק נגמר
                        endGame();
                    }
                }
            });

            // 4. ציור אובייקטים
            platforms.forEach(platform => platform.draw());
            coins.forEach(coin => coin.draw());
            enemies.forEach(enemy => enemy.draw());
            mario.draw();

            // 5. בקשה לפריים הבא
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            finalScore.textContent = score;
            gameOverScreen.style.visibility = 'visible';
        }

        // --- מאזיני אירועים (Event Listeners) ---

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // התאמת גודל הקנבס בשינוי גודל חלון
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // אתחול מחדש נדרש כדי למקם את הפלטפורמות נכון
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            initGame();
            gameLoop();
        });

        // --- התחלת המשחק ---
        initGame();
        gameLoop();

    </script>
</body>
</html>
